---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories: ["/v0", "/v1", "/v2"]
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * * *"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "dev"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      exclude:
        - "*"
    groups:
      docker-compose:
        patterns:
          - "*"
